<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Diary</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="loader" class="loader" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <header class="bar">
    <h1>My Diary</h1>
    <input id="search" class="search" type="search" placeholder="🔍 Search title or tags..." autocomplete="off">
    <span id="who" class="who"></span>
    <button id="logout" class="secondary small">Log out</button>
  </header>

  <div id="filter" class="filter" hidden>
    Showing <strong id="filter-tag"></strong>
    <button id="clear-filter" class="secondary small">Clear</button>
  </div>

  <main id="gallery" class="stage"></main>
  <div id="track" class="track" hidden><div id="thumb" class="thumb"></div></div>
  <p id="empty" class="empty" hidden></p>

  <button id="add" class="fab" aria-label="Add picture">+</button>

  
  <dialog id="upload-dialog">
    <form id="upload-form">
      <h2>New Upload</h2>
      <input name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
      <img id="preview" class="preview" hidden alt="">
      <input name="title" placeholder="Title" maxlength="200">
      <textarea name="description" rows="5" placeholder="Write about this piece..."></textarea>
      <input name="tags" placeholder="Tags, comma separated (e.g. ink, sketch)">
      <div id="quick-tags" class="tags quick"></div>
      <p id="upload-msg" class="msg"></p>
      <div class="actions">
        <button type="button" class="secondary" id="cancel-upload">Cancel</button>
        <button type="submit" id="save-btn">Save</button>
      </div>
    </form>
  </dialog>

  
  <dialog id="detail-dialog" class="detail">
    <img id="d-img" alt="">

    <div id="d-view" class="detail-body">
      <h2 id="d-title"></h2>
      <p id="d-date" class="date"></p>
      <p id="d-desc" class="desc"></p>
      <div id="d-tags" class="tags"></div>

      <div class="icon-row">
        <button id="edit-btn" class="icon-btn" aria-label="Edit" title="Edit">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button id="download-btn" class="icon-btn" aria-label="Download" title="Download">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
        <button id="delete-btn" class="icon-btn danger" aria-label="Delete" title="Delete">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>

      <button class="secondary" id="close-detail">Close</button>
    </div>

    <form id="edit-form" class="detail-body" hidden>
      <h2>Edit entry</h2>
      <input name="title" placeholder="Title" maxlength="200">
      <textarea name="description" rows="5" placeholder="Write about this piece..."></textarea>
      <input name="tags" placeholder="Tags, comma separated">
      <div id="edit-moods" class="tags quick"></div>
      <p id="edit-msg" class="msg"></p>
      <div class="actions">
        <button type="button" class="secondary" id="cancel-edit">Cancel</button>
        <button type="submit" id="edit-save">Save</button>
      </div>
    </form>
  </dialog>
  <footer class="credit">Made with ❤️ by Sankhya</footer>
  <script src="/static/background.js"></script>
  <script src="/static/diary.js"></script>
</body>
</html>
